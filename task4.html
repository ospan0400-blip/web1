<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style2.css">
    
</head>

<body>
    <p>Table Styling</p>
    <h1 class="heading">Student Grades</h1>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Subject</th>
                <th>Grade</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Ali</td>
                <td>Mathematics</td>
                <td>A</td>
            </tr>

            <tr class="highlightrow">
                <td>Aisha</td>
                <td>Computer Science</td>
                <td>A+</td>
            </tr>

            <tr>
                <td>John</td>
                <td>Physics</td>
                <td>B+</td>
            </tr>

            <tr>
                <td rowspan="2">Maria</td>
                <td>English</td>
                <td>A</td>
            </tr>

            <tr>
                <td colspan="1">History</td>
                <td>B+</td>
            </tr>
        </tbody>
    </table>

    <p>Form Styling</p>

    <h1 id="page-heading">Feedback Form</h1>

    <form id="feedbackform">

        <div class="formgroup">
            <label class="formlabel" for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">
        </div>

        <div class="formgroup">
            <label class="formlabel" for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">
        </div>

        <div class="formgroup">
            <label class="formlabel" for="role">Role:</label>
            <select id="role" name="role">
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div class="formgroup">
            <label class="formlabel">
                Did you enjoy the course?
            </label>

            <div class="radio-group">
                <label>
                    <input type="radio" name="enjoyed" value="yes">
                    Yes
                </label>

                <label>
                    <input type="radio" name="enjoyed" value="no">
                    No
                </label>
            </div>
        </div>

        <div class="formgroup">
            <label class="form-label" for="comments">Comments:</label>
            <textarea id="comments" name="comments"
                      placeholder="Write your comments here..."></textarea>
        </div>

        <button id="submitbutton" type="submit">
            Submit Feedback
        </button>

    </form>

</body>
</html>
